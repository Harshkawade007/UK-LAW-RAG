<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRAG Escalation — Law RAG</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Law RAG — CRAG Grading &amp; Escalation</h1>

    <svg viewBox="0 0 1040 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="crag-title crag-desc">
      <title id="crag-title">CRAG grading and escalation sequence</title>
      <desc id="crag-desc">A user question is reranked, an LLM grades the retrieved sections as relevant, partial, or irrelevant, and only when the grade is not relevant does the system escalate once to the route pipeline before returning a cited answer.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= LIFELINES ================= -->
      <line x1="120" y1="68" x2="120" y2="460" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="380" y1="68" x2="380" y2="460" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="640" y1="68" x2="640" y2="460" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="68" x2="900" y2="460" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ================= ACTIVATION BARS ================= -->
      <rect x="376" y="88" width="8" height="328" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="636" y="188" width="8" height="40" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="896" y="304" width="8" height="44" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ================= OPT FRAGMENT ================= -->
      <rect x="340" y="252" width="600" height="124" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="340" y="252" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="360" y="264" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">OPT</text>
      <text x="404" y="280" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[grade != relevant]</text>

      <!-- ================= MESSAGES ================= -->

      <!-- M1: User -> Orchestrator (call) -->
      <line x1="120" y1="92" x2="376" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="176" y="76" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="220" y="85" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ASK QUESTION</text>

      <!-- Self-message: rerank search -->
      <path d="M 384,132 H 452 Q 460,132 460,140 V 152 Q 460,160 452,160 H 384"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="464" y="140" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="512" y="151" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RERANK SEARCH</text>

      <!-- M2: Orchestrator -> Grader (call) -->
      <line x1="384" y1="192" x2="636" y2="192" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="440" y="176" width="140" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GRADE(PARENTS)</text>

      <!-- M3: Grader --> Orchestrator (return, dashed) -->
      <line x1="636" y1="224" x2="384" y2="224" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="424" y="208" width="172" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="217" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RELEVANCE + REASON</text>

      <!-- M4 (inside OPT): Orchestrator -> Route (call) -->
      <line x1="384" y1="308" x2="896" y2="308" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="592" y="292" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="301" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ESCALATE</text>

      <!-- M5 (inside OPT): Route --> Orchestrator (return, dashed) -->
      <line x1="896" y1="344" x2="384" y2="344" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="560" y="328" width="160" height="12" rx="2" fill="#f5f5f5"/>
      <text x="640" y="337" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-RANKED PARENTS</text>

      <!-- M6: Orchestrator --> User (headline success, solid accent) -->
      <line x1="376" y1="412" x2="120" y2="412" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="164" y="392" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="401" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CITED ANSWER + TRACE</text>

      <!-- ================= ACTORS ================= -->
      <rect x="40" y="20" width="160" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User</text>

      <rect x="300" y="20" width="160" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="380" y="42" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CRAG Orchestrator</text>
      <text x="380" y="58" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retrieval/crag.py</text>

      <rect x="560" y="20" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="640" y="42" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grader</text>
      <text x="640" y="58" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Llama-3.1-8B</text>

      <rect x="820" y="20" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="900" y="42" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Route Pipeline</text>
      <text x="900" y="58" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">transform + fuse</text>

      <!-- ================= LEGEND ================= -->
      <line x1="30" y1="492" x2="1010" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="503" x2="152" y2="503" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="160" y="507" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CALL</text>

      <line x1="260" y1="503" x2="292" y2="503" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="300" y="507" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>

      <line x1="420" y1="503" x2="452" y2="503" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="460" y="507" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HEADLINE SUCCESS</text>

      <rect x="640" y="497" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="664" y="507" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OPT FRAGMENT (ESCALATION)</text>

    </svg>
  </div>
</body>
</html>
