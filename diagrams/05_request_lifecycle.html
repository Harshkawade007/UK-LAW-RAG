<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Lifecycle — Law RAG</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1040px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Diagram Design</p>
    <h1>Law RAG — /chat Request Lifecycle</h1>

    <svg viewBox="0 0 1040 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
      <title id="lifecycle-title">Chat request lifecycle</title>
      <desc id="lifecycle-desc">A browser posts a question to FastAPI, which retrieves ranked sections from the retrieval store, then either calls DeepInfra to generate a cited answer when generation is requested, or skips generation to stay on the free retrieval-only path, before returning to the browser.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= LIFELINES ================= -->
      <line x1="120" y1="68" x2="120" y2="492" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="380" y1="68" x2="380" y2="492" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="640" y1="68" x2="640" y2="492" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="900" y1="68" x2="900" y2="492" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ================= ACTIVATION BARS ================= -->
      <rect x="376" y="88"  width="8" height="368" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="636" y="136" width="8" height="44"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="896" y="260" width="8" height="44"  fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- ================= ALT FRAGMENT ================= -->
      <rect x="340" y="208" width="600" height="216" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <rect x="340" y="208" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="360" y="220" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">ALT</text>
      <text x="404" y="236" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[generate = true]</text>
      <line x1="348" y1="332" x2="932" y2="332" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="404" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.04em">[else — generate = false]</text>

      <!-- ================= MESSAGES ================= -->

      <!-- M1: Browser -> FastAPI -->
      <line x1="120" y1="92" x2="376" y2="92" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="192" y="76" width="112" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="85" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">POST /chat</text>

      <!-- M2: FastAPI -> Retrieval Store -->
      <line x1="384" y1="140" x2="636" y2="140" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="436" y="124" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="133" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRIEVE(MODE)</text>

      <!-- M3: Retrieval Store --> FastAPI (return) -->
      <line x1="636" y1="176" x2="384" y2="176" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="436" y="160" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="510" y="169" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RANKED SECTIONS</text>

      <!-- M4 (ALT region 1): FastAPI -> DeepInfra -->
      <line x1="384" y1="264" x2="896" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="576" y="248" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="257" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GENERATE(SECTIONS)</text>

      <!-- M5 (ALT region 1): DeepInfra --> FastAPI (return) -->
      <line x1="896" y1="300" x2="384" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="576" y="284" width="148" height="12" rx="2" fill="#f5f5f5"/>
      <text x="650" y="293" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CITED ANSWER</text>

      <!-- Self-message (ALT region 2, else): skip generation -->
      <path d="M 384,384 H 452 Q 460,384 460,392 V 400 Q 460,408 452,408 H 384"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="464" y="386" width="88" height="16" rx="2" fill="#f5f5f5"/>
      <text x="508" y="397" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SKIP (FREE)</text>

      <!-- M6: FastAPI --> Browser (headline success) -->
      <line x1="376" y1="452" x2="120" y2="452" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="176" y="432" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="248" y="441" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SECTIONS [+ ANSWER]</text>

      <!-- ================= ACTORS ================= -->
      <rect x="40" y="20" width="160" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="120" y="48" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser</text>

      <rect x="300" y="20" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="380" y="42" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
      <text x="380" y="58" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">api/main.py</text>

      <rect x="560" y="20" width="160" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="640" y="42" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieval Store</text>
      <text x="640" y="58" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Qdrant + BM25 + parents</text>

      <rect x="820" y="20" width="160" height="48" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="900" y="42" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DeepInfra</text>
      <text x="900" y="58" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Llama-3.3-70B generate</text>

      <!-- ================= LEGEND ================= -->
      <line x1="30" y1="512" x2="1010" y2="512" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="528" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="120" y1="523" x2="152" y2="523" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="160" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CALL</text>

      <line x1="260" y1="523" x2="292" y2="523" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="300" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">RETURN</text>

      <line x1="420" y1="523" x2="452" y2="523" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="460" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HEADLINE SUCCESS</text>

      <rect x="640" y="517" width="16" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
      <text x="664" y="527" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">ALT (GENERATE ON/OFF)</text>

    </svg>
  </div>
</body>
</html>
