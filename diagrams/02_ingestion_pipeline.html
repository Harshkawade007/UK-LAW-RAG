<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingestion Pipeline — Law RAG</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 640px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 480px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Law RAG — Ingestion Pipeline</h1>

    <svg viewBox="0 0 640 808" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ingest-title ingest-desc">
      <title id="ingest-title">Law RAG ingestion pipeline</title>
      <desc id="ingest-desc">Four sequential scripts turn raw gov.uk pages into a searchable index: fetch.py saves raw HTML, clean.py extracts plain text, chunk.py splits text into parent and child chunks, and index.py embeds and writes the children into Qdrant.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= ARROWS ================= -->
      <line x1="320" y1="104" x2="320" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="272" y="118" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="127" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP SCRAPE</text>

      <line x1="320" y1="232" x2="320" y2="288" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="284" y="246" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="255" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RAW HTML</text>

      <line x1="320" y1="360" x2="320" y2="416" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="276" y="374" width="88" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="383" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CLEANED TEXT</text>

      <line x1="320" y1="488" x2="320" y2="544" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="272" y="502" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="511" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARENT/CHILD</text>

      <line x1="320" y1="616" x2="320" y2="672" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="272" y="630" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="320" y="639" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMBED + INDEX</text>

      <!-- ================= NODES ================= -->

      <!-- Start oval -->
      <rect x="180" y="40" width="280" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="180" y="40" width="280" height="64" rx="32" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="320" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">gov.uk &amp; NHS Pages</text>
      <text x="320" y="84" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">visa · tax · housing · nhs · …</text>

      <!-- Step 1: fetch.py -->
      <rect x="160" y="160" width="320" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="160" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="166" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="194" y="175" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 1</text>
      <text x="320" y="196" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">fetch.py</text>
      <text x="320" y="212" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">scrape gov.uk seed lists → laws/</text>

      <!-- Step 2: clean.py -->
      <rect x="160" y="288" width="320" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="288" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="294" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="194" y="303" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 2</text>
      <text x="320" y="324" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">clean.py</text>
      <text x="320" y="340" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raw HTML → cleaned/ plain text</text>

      <!-- Step 3: chunk.py (focal) -->
      <rect x="160" y="416" width="320" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="416" width="320" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="168" y="422" width="52" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="194" y="431" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 3</text>
      <text x="320" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">chunk.py</text>
      <text x="320" y="468" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parent + child split, ~250-tok children</text>

      <!-- Step 4: index.py -->
      <rect x="160" y="544" width="320" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="160" y="544" width="320" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="168" y="550" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="194" y="559" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STEP 4</text>
      <text x="320" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">index.py</text>
      <text x="320" y="596" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bge-small-en-v1.5 → Qdrant (384-dim)</text>

      <!-- End oval -->
      <rect x="180" y="672" width="280" height="64" rx="32" fill="#f5f5f5"/>
      <rect x="180" y="672" width="280" height="64" rx="32" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="320" y="700" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ready to Query</text>
      <text x="320" y="716" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">qdrant_data/ + chunks/*.jsonl</text>

      <!-- ================= LEGEND ================= -->
      <line x1="30" y1="764" x2="610" y2="764" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="780" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="772" width="16" height="10" rx="5" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="144" y="780" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">START / END</text>

      <rect x="280" y="772" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="304" y="780" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">STEP</text>

      <rect x="400" y="772" width="16" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="424" y="780" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">MOST DISTINCTIVE STEP</text>

    </svg>
  </div>
</body>
</html>
