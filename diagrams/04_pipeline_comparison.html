<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pipeline Comparison — Law RAG</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1000px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.5rem;
    }
    .subtitle {
      font-family: var(--font-sans);
      font-size: 0.9rem;
      color: var(--color-muted);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar Chart · Diagram Design</p>
    <h1>Law RAG — Retrieval Pipeline Comparison</h1>
    <p class="subtitle">MRR@5, 39-question eval set (parent-level grounding), 2026-08-06</p>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cmp-title cmp-desc">
      <title id="cmp-title">Retrieval pipeline MRR comparison</title>
      <desc id="cmp-desc">Bar chart comparing MRR at 5 across six retrieval configurations on a 39-question evaluation set: dense 0.66, hybrid 0.58, rerank 0.66, route 0.45, crag 0.67 as the best real pipeline, and a per-query oracle ceiling of 0.82.</desc>
      <defs></defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= GRIDLINES ================= -->
      <line x1="80" y1="344" x2="960" y2="344" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="268" x2="960" y2="268" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="192" x2="960" y2="192" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="116" x2="960" y2="116" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <!-- Y axis -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- Y axis labels -->
      <text x="72" y="43"  fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">1.0</text>
      <text x="72" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.8</text>
      <text x="72" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.6</text>
      <text x="72" y="271" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.4</text>
      <text x="72" y="347" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.2</text>
      <text x="72" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0.0</text>

      <!-- ================= BARS ================= -->

      <!-- dense .6599 -->
      <rect x="108" y="170" width="88" height="250" fill="#f5f5f5"/>
      <rect x="108" y="170" width="88" height="250" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="152" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.660</text>
      <text x="152" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DENSE</text>

      <!-- hybrid .5784 -->
      <rect x="248" y="200" width="88" height="220" fill="#f5f5f5"/>
      <rect x="248" y="200" width="88" height="220" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="292" y="192" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.578</text>
      <text x="292" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HYBRID</text>

      <!-- rerank .6608 -->
      <rect x="388" y="168" width="88" height="252" fill="#f5f5f5"/>
      <rect x="388" y="168" width="88" height="252" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="432" y="160" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.661</text>
      <text x="432" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RERANK</text>

      <!-- route .4486 -->
      <rect x="528" y="248" width="88" height="172" fill="#f5f5f5"/>
      <rect x="528" y="248" width="88" height="172" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="572" y="240" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.449</text>
      <text x="572" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ROUTE</text>

      <!-- crag .6743 (focal) -->
      <rect x="668" y="164" width="88" height="256" fill="#f5f5f5"/>
      <rect x="668" y="164" width="88" height="256" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="712" y="156" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.674</text>
      <text x="712" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CRAG</text>

      <!-- oracle .8221 (ceiling, dashed) -->
      <rect x="808" y="108" width="88" height="312" fill="#f5f5f5"/>
      <rect x="808" y="108" width="88" height="312" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="852" y="100" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0.822</text>
      <text x="852" y="440" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ORACLE</text>

      <!-- ================= LEGEND ================= -->
      <line x1="30" y1="464" x2="970" y2="464" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="140" y="472" width="10" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="156" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">SELECTABLE MODE</text>

      <rect x="320" y="472" width="10" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="336" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">BEST REAL MODE</text>

      <rect x="500" y="472" width="10" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.35)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="516" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">PER-QUERY ORACLE CEILING (NOT SELECTABLE)</text>

    </svg>
  </div>
</body>
</html>
