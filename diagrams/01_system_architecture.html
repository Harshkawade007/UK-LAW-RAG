<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Architecture — Law RAG</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Law RAG — System Architecture</h1>

    <svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sysarch-title sysarch-desc">
      <title id="sysarch-title">Law RAG system architecture</title>
      <desc id="sysarch-desc">A browser sends questions through a FastAPI backend to a set of retrieval pipelines, which query a vector store and a chunk store, optionally call DeepInfra LLM APIs for query transformation, grading, and answer generation, and return a cited answer; an offline ingestion pipeline populates the vector and chunk stores.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ================= ARROWS (drawn before nodes) ================= -->

      <!-- A1: Browser <-> FastAPI (bidirectional, x=600 straight) -->
      <line x1="600" y1="104" x2="600" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
      <rect x="516" y="130" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="139" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHAT / CITED ANSWER</text>

      <!-- A2: FastAPI -> Retrieval Pipelines (x=600 straight) -->
      <line x1="600" y1="240" x2="600" y2="312" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="566" y="266" width="68" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="275" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

      <!-- A3: Retrieval Pipelines -> Qdrant (elbow, left+down) -->
      <path d="M 510,400 V 428 Q 510,436 502,436 H 320 Q 312,436 312,444 V 472"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="368" y="424" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="398" y="433" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DENSE</text>

      <!-- A4: Retrieval Pipelines -> Chunk Store (x=600 straight) -->
      <line x1="600" y1="400" x2="600" y2="472" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="548" y="426" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="435" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BM25 + LOOKUP</text>

      <!-- A5: Retrieval Pipelines -> DeepInfra LLM APIs (elbow, right+down) -->
      <path d="M 690,400 V 428 Q 690,436 698,436 H 880 Q 888,436 888,444 V 472"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="748" y="424" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="784" y="433" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LLM CALLS</text>

      <!-- A6: DeepInfra LLM APIs -> FastAPI (return path, right channel) -->
      <path d="M 1000,512 H 1072 Q 1080,512 1080,504 V 216 Q 1080,208 1072,208 H 700"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="1024" y="352" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1052" y="361" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSWER</text>

      <!-- A7: Ingestion Pipeline -> Qdrant (dashed, x=312 straight) -->
      <line x1="312" y1="624" x2="312" y2="552" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="284" y="580" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="312" y="589" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

      <!-- A8: Ingestion Pipeline -> Chunk Store (dashed, x=600 straight) -->
      <line x1="600" y1="624" x2="600" y2="552" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="572" y="580" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="600" y="589" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>

      <!-- ================= NODES ================= -->

      <!-- 1. Browser UI (input) -->
      <rect x="500" y="40" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="40" width="200" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="508" y="46" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="524" y="55" fill="rgba(122,131,153,0.9)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="600" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Browser UI</text>
      <text x="600" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dark / light · vanilla JS</text>

      <!-- 2. FastAPI (backend) -->
      <rect x="500" y="176" width="200" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="500" y="176" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="508" y="182" width="36" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="526" y="191" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="600" y="212" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI</text>
      <text x="600" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">POST /chat · GET /health</text>

      <!-- 3. Retrieval Pipelines (focal) -->
      <rect x="420" y="312" width="360" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="420" y="312" width="360" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="428" y="318" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="448" y="327" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="600" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieval Pipelines</text>
      <text x="600" y="368" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dense · hybrid · rerank · crag</text>
      <text x="600" y="382" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">route · agentic</text>

      <!-- 4. Qdrant Vector Store (store) -->
      <rect x="200" y="472" width="224" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="472" width="224" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="208" y="478" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="230" y="487" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="312" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qdrant Vector Store</text>
      <text x="312" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">law_children · 4,721 pts</text>
      <text x="312" y="538" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cosine · 384-dim</text>

      <!-- 5. Chunk Store (store) -->
      <rect x="488" y="472" width="224" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="488" y="472" width="224" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="496" y="478" width="44" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="518" y="487" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">STORE</text>
      <text x="600" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Chunk Store</text>
      <text x="600" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parents + children.jsonl</text>
      <text x="600" y="538" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BM25 (rank-bm25)</text>

      <!-- 6. DeepInfra LLM APIs (external) -->
      <rect x="776" y="472" width="224" height="80" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="472" width="224" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="784" y="478" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="800" y="487" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LLM</text>
      <text x="888" y="508" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">DeepInfra LLM APIs</text>
      <text x="888" y="524" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Llama-3.1-8B transform/grade</text>
      <text x="888" y="538" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Llama-3.3-70B generate</text>

      <!-- 7. Ingestion Pipeline (optional/offline) -->
      <rect x="200" y="624" width="800" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="200" y="624" width="800" height="64" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="208" y="630" width="52" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="234" y="639" fill="rgba(45,49,66,0.6)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BATCH</text>
      <text x="600" y="656" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ingestion Pipeline (offline)</text>
      <text x="600" y="672" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fetch → clean → chunk → index  ·  laws/ → cleaned/ → chunks/ → qdrant_data/</text>

      <!-- ================= LEGEND ================= -->
      <line x1="30" y1="716" x2="1170" y2="716" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="732" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="724" width="10" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="136" y="732" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CLIENT</text>

      <rect x="230" y="724" width="10" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="246" y="732" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">BACKEND</text>

      <rect x="360" y="724" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="376" y="732" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">CORE PIPELINE</text>

      <rect x="520" y="724" width="10" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="536" y="732" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">DATA STORE</text>

      <rect x="670" y="724" width="10" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="686" y="732" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">EXTERNAL LLM</text>

      <rect x="820" y="724" width="10" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,2"/>
      <text x="836" y="732" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">OFFLINE / BATCH</text>

    </svg>
  </div>
</body>
</html>
