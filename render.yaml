# Render "Blueprint" - lets Render create and configure the service from this
# file instead of clicking through the dashboard. Connect the repo at
# https://dashboard.render.com/blueprints and Render reads this automatically.
#
# DEEPINFRA_TOKEN, QDRANT_URL and QDRANT_API_KEY are deliberately left as
# `sync: false` - Render will prompt for them once in the dashboard instead of
# storing secrets in this committed file.
services:
  - type: web
    name: uk-law-rag
    runtime: docker
    # Free and Starter both cap at 512MB RAM (Starter only adds more CPU) -
    # verified locally under a 512MB cgroup limit that the app idles around
    # 350MB and peaks under 450MB even on /compare (all 5 pipelines at once),
    # after switching to the CPU-only torch build in the Dockerfile. Free's
    # actual tradeoff is the 15-minute idle spin-down, not memory: the first
    # request after a lull pays a cold start again. Bump to `standard` (2GB)
    # if that spin-down becomes a problem.
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEEPINFRA_TOKEN
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
