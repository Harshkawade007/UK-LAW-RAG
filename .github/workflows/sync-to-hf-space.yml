name: Sync to Hugging Face Space

# Mirrors main to the HF Space on every push, so the Space rebuilds and
# redeploys automatically - GitHub stays the single source of truth, and the
# Space is never edited directly. Uses HF's own hub-sync action (uploads file
# contents via the hf CLI) rather than a raw `git push` with a token URL,
# which failed authentication in testing for reasons the GitHub API wouldn't
# show without repo admin rights on the Actions logs.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Space needs its own README.md with HF's YAML frontmatter (sdk,
      # app_port, ...) at the top - GitHub doesn't understand that syntax and
      # renders it as ugly literal text, so the real README.md in this repo
      # deliberately has none. Swap in the Space-only version (frontmatter +
      # a short blurb pointing back here) just for this sync step; the actual
      # committed README.md on GitHub is never touched.
      - name: Use the Space-specific README for this sync only
        run: cp .github/space-readme.md README.md

      - uses: huggingface/hub-sync@v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Harsh-k-007/uk-law-rag
          hf_token: ${{ secrets.HF_TOKEN }}
          space_sdk: docker
