[project]
name = "law-rag-project"
version = "0.1.0"
description = "Agentic RAG over UK gov.uk and NHS guidance for international students - cited answers, self-correction, and refusal when the corpus does not cover the question"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "tiktoken>=0.13.0",
    "sentence-transformers>=5.6.1",
    "qdrant-client>=1.18.0",
    "openai>=2.48.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "fastapi>=0.140.13",
    "uvicorn[standard]>=0.51.0",
    "slowapi>=0.1.10",
]
