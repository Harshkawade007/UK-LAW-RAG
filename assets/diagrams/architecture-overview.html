<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Architecture overview — indexing and answering</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f5f5; --paper-2: #ececec; --ink: #2d3142; --muted: #4f5d75;
    --soft: #7a8399; --rule: rgba(45,49,66,0.12); --accent: #eb6c36;
    --accent-tint: rgba(235,108,54,0.08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Geist', sans-serif; padding: 2.5rem 1.5rem; }
  .wrap { max-width: 1240px; margin: 0 auto; }
  .eyebrow { font-family: 'Geist Mono', monospace; font-size: 8px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.5rem; }
  h1 { font-family: 'Instrument Serif', serif; font-weight: 400; font-size: 1.75rem; margin: 0 0 0.25rem; }
  .subtitle { font-family: 'Geist', sans-serif; color: var(--muted); font-size: 0.95rem; margin: 0 0 1.5rem; }
  .diagram-container { overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; }
  footer { margin-top: 1.5rem; padding-top: 0.75rem; border-top: 1px solid var(--rule); font-family: 'Geist Mono', monospace; font-size: 8px; color: var(--soft); }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">UK LAW RAG — ARCHITECTURE</p>
  <h1>From raw pages to a cited answer</h1>
  <p class="subtitle">Indexing happens once and is already done. Answering a question picks one of six retrieval pipelines, all reading the same index.</p>

  <div class="diagram-container">
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="arch-overview-title arch-overview-desc">
<title id="arch-overview-title">System overview: indexing pipeline feeding six retrieval strategies</title>
<desc id="arch-overview-desc">Diagram showing that gov.uk and NHS sources are turned into a searchable Qdrant index by an already-run ingestion pipeline, and that answering a question means search.py dispatching to one of six retrieval pipelines — dense, hybrid, rerank, route, crag, or agentic, with crag highlighted as the default — before the result is expanded to full sections and turned into a cited answer by generate.py.</desc>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
  </marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
  </marker>
</defs>

<rect width="1280" height="720" fill="#f5f5f5"/>

<rect x="52" y="60" width="180" height="12" rx="2" fill="#f5f5f5"/>
<text x="58" y="69" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">ALREADY INDEXED</text>

<rect x="474" y="56" width="766" height="568" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="486" y="60" width="220" height="12" rx="2" fill="#f5f5f5"/>
<text x="492" y="69" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">ANSWERING A QUESTION</text>

<!-- ===================== ARROWS ===================== -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
  <!-- Sources -> Ingestion pipeline -->
  <line x1="156" y1="340" x2="176" y2="340" marker-end="url(#arrow)"/>
  <!-- Ingestion pipeline -> Qdrant -->
  <line x1="320" y1="340" x2="340" y2="340" marker-end="url(#arrow)"/>
  <!-- Question -> dispatch (upper attach point on dispatch's left edge) -->
  <line x1="580" y1="328" x2="600" y2="328" marker-end="url(#arrow)"/>
</g>

<!-- Qdrant -> search.py dispatch: crosses the zone boundary, dashed (supporting dependency, not
     the main flow). Routed under the Question box rather than straight through it, and enters
     dispatch's left edge below Question's attach point so the two incoming edges stay distinct. -->
<g stroke="#4f5d75" stroke-width="1" fill="none" stroke-dasharray="4,3">
  <path d="M 434,352 V 388 H 584 Q 592,388 592,380 V 360 Q 592,352 600,352" marker-end="url(#arrow)"/>
</g>

<!-- dispatch -> bus1 trunk (no arrow, supply segment) -->
<g stroke="#4f5d75" stroke-width="1.2" fill="none">
  <line x1="730" y1="340" x2="750" y2="340"/>
  <line x1="750" y1="162" x2="750" y2="522"/>
  <!-- bus1 -> each pipeline (delivery, arrowed) -->
  <line x1="750" y1="162" x2="766" y2="162" marker-end="url(#arrow)"/>
  <line x1="750" y1="234" x2="766" y2="234" marker-end="url(#arrow)"/>
  <line x1="750" y1="306" x2="766" y2="306" marker-end="url(#arrow)"/>
  <line x1="750" y1="378" x2="766" y2="378" marker-end="url(#arrow-accent)"/>
  <line x1="750" y1="450" x2="766" y2="450" marker-end="url(#arrow)"/>
  <line x1="750" y1="522" x2="766" y2="522" marker-end="url(#arrow)"/>

  <!-- each pipeline -> bus2 (supply, no arrow) -->
  <line x1="846" y1="162" x2="862" y2="162"/>
  <line x1="846" y1="234" x2="862" y2="234"/>
  <line x1="846" y1="306" x2="862" y2="306"/>
  <line x1="846" y1="378" x2="862" y2="378"/>
  <line x1="846" y1="450" x2="862" y2="450"/>
  <line x1="846" y1="522" x2="862" y2="522"/>
  <line x1="862" y1="162" x2="862" y2="522"/>
  <!-- bus2 -> expand_to_parents (delivery, arrowed) -->
  <line x1="862" y1="340" x2="878" y2="340" marker-end="url(#arrow)"/>

  <!-- expand -> generate -->
  <line x1="1018" y1="340" x2="1038" y2="340" marker-end="url(#arrow)"/>
  <!-- generate -> answer -->
  <line x1="1122" y1="340" x2="1142" y2="340" marker-end="url(#arrow)"/>
</g>
