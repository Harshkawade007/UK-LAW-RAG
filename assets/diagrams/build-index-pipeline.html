<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build the index — pipeline architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5f5f5;
    --paper-2: #ececec;
    --ink: #2d3142;
    --muted: #4f5d75;
    --soft: #7a8399;
    --rule: rgba(45,49,66,0.12);
    --accent: #eb6c36;
    --accent-tint: rgba(235,108,54,0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Geist', sans-serif;
    padding: 2.5rem 1.5rem;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }
  .eyebrow {
    font-family: 'Geist Mono', monospace;
    font-size: 8px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 0.5rem;
  }
  h1 {
    font-family: 'Instrument Serif', serif;
    font-weight: 400;
    font-size: 1.75rem;
    margin: 0 0 0.25rem;
  }
  .subtitle {
    font-family: 'Geist', sans-serif;
    color: var(--muted);
    font-size: 0.95rem;
    margin: 0 0 1.5rem;
  }
  .diagram-container { overflow-x: auto; }
  svg { display: block; width: 100%; height: auto; }
  footer {
    margin-top: 1.5rem;
    padding-top: 0.75rem;
    border-top: 1px solid var(--rule);
    font-family: 'Geist Mono', monospace;
    font-size: 8px;
    color: var(--soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">UK LAW RAG — ARCHITECTURE</p>
  <h1>Build the index</h1>
  <p class="subtitle">Raw pages become a searchable vector index through five steps. Fetching and deduping only need to happen once.</p>

  <div class="diagram-container">
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="build-index-title build-index-desc">
<title id="build-index-title">Build-the-index pipeline: fetch through Qdrant</title>
<desc id="build-index-desc">Diagram showing that fetching gov.uk and NHS pages into laws/ and deduplicating them is already done and committed to the repo, while cleaning the HTML, chunking pages into parent sections and child pieces, and embedding those pieces into the Qdrant index is what running ingestion/build.py performs.</desc>

<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
  <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
  </marker>
  <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
  </marker>
</defs>

<!-- background -->
<rect width="960" height="600" fill="#f5f5f5"/>

<text x="58" y="69" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.10em">ALREADY DONE — LAWS/ IS COMMITTED</text>

<g stroke="#4f5d75" stroke-width="1.2" fill="none">

  <line x1="568" y1="160" x2="596" y2="160" marker-end="url(#arrow)"/>

  <line x1="680" y1="160" x2="708" y2="160" marker-end="url(#arrow)"/>

  <path d="M 640,184 V 246 Q 640,254 632,254 H 568 Q 560,254 560,262 V 312" marker-end="url(#arrow)"/>
  <!-- children.jsonl -> index.py (same y, straight) -->
  <line x1="632" y1="344" x2="660" y2="344" marker-end="url(#arrow)"/>
  <!-- index.py -> qdrant_data/ (same y, straight) -->
  <line x1="744" y1="344" x2="772" y2="344" marker-end="url(#arrow)"/>
