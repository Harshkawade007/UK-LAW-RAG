<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 304" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hybrid-title hybrid-desc">
<title id="hybrid-title">hybrid pipeline: dense and BM25 search merged by rank</title>
<desc id="hybrid-desc">Diagram showing the hybrid retrieval pipeline: the question is searched with dense vector search and BM25 keyword search at the same time, the two ranked lists are merged by Reciprocal Rank Fusion, and the top results expand to their parent sections.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
</defs>
<rect width="960" height="304" fill="#f5f5f5"/>

<g stroke="#4f5d75" stroke-width="1.2" fill="none">
  <!-- Question -> dense (up) -->
  <path d="M 170,140 H 194 Q 202,140 202,132 V 94 Q 202,86 210,86 H 234" marker-end="url(#arrow)"/>
  <!-- Question -> BM25 (down) -->
  <path d="M 170,164 H 194 Q 202,164 202,172 V 210 Q 202,218 210,218 H 234" marker-end="url(#arrow)"/>
  <!-- dense -> RRF merge -->
  <path d="M 374,86 H 398 Q 406,86 406,94 V 132 Q 406,140 414,140 H 438" marker-end="url(#arrow)"/>
  <!-- BM25 -> RRF merge -->
  <path d="M 374,218 H 398 Q 406,218 406,210 V 172 Q 406,164 414,164 H 438" marker-end="url(#arrow)"/>
  <!-- RRF merge -> Sections -->
  <line x1="568" y1="152" x2="600" y2="152" marker-end="url(#arrow)"/>
</g>

<rect x="60" y="140" width="110" height="48" rx="6" fill="#f5f5f5"/>
<rect x="60" y="140" width="110" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="115" y="168" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Question</text>

<rect x="234" y="62" width="140" height="48" rx="6" fill="#f5f5f5"/>
<rect x="234" y="62" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="304" y="90" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dense search</text>

<rect x="234" y="194" width="140" height="48" rx="6" fill="#f5f5f5"/>
<rect x="234" y="194" width="140" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="304" y="217" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BM25 keyword</text>
<text x="304" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">search</text>

<rect x="438" y="128" width="130" height="48" rx="6" fill="#f5f5f5"/>
<rect x="438" y="128" width="130" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="503" y="151" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RRF merge</text>
<text x="503" y="167" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">by rank, not score</text>

<rect x="600" y="124" width="150" height="56" rx="6" fill="#f5f5f5"/>
<rect x="600" y="124" width="150" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="675" y="148" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parent sections</text>
<text x="675" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merged top results</text>
</svg>
