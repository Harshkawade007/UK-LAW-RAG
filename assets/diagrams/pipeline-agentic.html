<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>agentic pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --soft:#7a8399; --rule:rgba(45,49,66,0.12); }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'Geist',sans-serif; padding:2.5rem 1.5rem; }
  .wrap { max-width:1000px; margin:0 auto; }
  .eyebrow { font-family:'Geist Mono',monospace; font-size:8px; letter-spacing:0.18em; text-transform:uppercase; color:var(--muted); margin:0 0 0.5rem; }
  h1 { font-family:'Instrument Serif',serif; font-weight:400; font-size:1.5rem; margin:0 0 1.25rem; }
  .diagram-container { overflow-x:auto; }
  svg { display:block; width:100%; height:auto; }
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">UK LAW RAG — PIPELINE</p>
  <h1>agentic</h1>
  <div class="diagram-container">
<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="agentic-title agentic-desc">
<title id="agentic-title">agentic pipeline: an LLM picks one of the other five pipelines</title>
<desc id="agentic-desc">Diagram showing the agentic pipeline: one LLM call reads the question and picks exactly one of the other five pipelines — dense, hybrid, rerank, route, or crag — to actually run.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
</defs>
<rect width="960" height="420" fill="#f5f5f5"/>

<g stroke="#4f5d75" stroke-width="1.2" fill="none">
  <!-- Question -> LLM picks -->
  <line x1="170" y1="224" x2="202" y2="224" marker-end="url(#arrow)"/>

  <!-- LLM picks -> each of the 5 options, staggered turn points to avoid overlaps -->
  <path d="M 352,196 H 372 Q 380,196 380,188 V 104 Q 380,96 388,96 H 460" marker-end="url(#arrow)"/>
  <path d="M 352,210 H 384 Q 392,210 392,202 V 168 Q 392,160 400,160 H 460" marker-end="url(#arrow)"/>
  <line x1="352" y1="224" x2="460" y2="224" marker-end="url(#arrow)"/>
  <path d="M 352,238 H 384 Q 392,238 392,246 V 280 Q 392,288 400,288 H 460" marker-end="url(#arrow)"/>
  <path d="M 352,254 H 372 Q 380,254 380,262 V 344 Q 380,352 388,352 H 460" marker-end="url(#arrow)"/>
</g>

<rect x="60" y="200" width="110" height="48" rx="6" fill="#f5f5f5"/>
<rect x="60" y="200" width="110" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="115" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Question</text>

<rect x="202" y="180" width="150" height="88" rx="6" fill="#f5f5f5"/>
<rect x="202" y="180" width="150" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="277" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LLM picks</text>
<text x="277" y="232" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">one</text>
<text x="277" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one LLM call</text>

<rect x="460" y="76" width="140" height="40" rx="6" fill="#f5f5f5"/>
<rect x="460" y="76" width="140" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="530" y="101" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">dense</text>

<rect x="460" y="140" width="140" height="40" rx="6" fill="#f5f5f5"/>
<rect x="460" y="140" width="140" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="530" y="165" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">hybrid</text>

<rect x="460" y="204" width="140" height="40" rx="6" fill="#f5f5f5"/>
<rect x="460" y="204" width="140" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="530" y="229" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rerank</text>

<rect x="460" y="268" width="140" height="40" rx="6" fill="#f5f5f5"/>
<rect x="460" y="268" width="140" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="530" y="293" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">route</text>

<rect x="460" y="332" width="140" height="40" rx="6" fill="#f5f5f5"/>
<rect x="460" y="332" width="140" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="530" y="357" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">crag</text>

<text x="530" y="405" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">picks exactly one and runs it — never itself, that would loop forever</text>
</svg>
  </div>
</div>
</body>
</html>
