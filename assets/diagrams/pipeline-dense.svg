<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 176" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dense-title dense-desc">
<title id="dense-title">dense pipeline: embed the question, search Qdrant, expand to sections</title>
<desc id="dense-desc">Diagram showing the dense retrieval pipeline: the question is embedded into a vector, searched against the Qdrant index of child chunks, and the nearest matches expand to their full parent sections.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
  <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
    <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
  </marker>
</defs>
<rect width="960" height="176" fill="#f5f5f5"/>

<g stroke="#4f5d75" stroke-width="1.2" fill="none">
  <line x1="374" y1="88" x2="406" y2="88" marker-end="url(#arrow)"/>
  <line x1="516" y1="88" x2="548" y2="88" marker-end="url(#arrow)"/>
</g>
<rect x="376" y="72" width="28" height="12" rx="2" fill="#f5f5f5"/>
<text x="390" y="81" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">EMBED</text>

<rect x="264" y="64" width="110" height="48" rx="6" fill="#f5f5f5"/>
<rect x="264" y="64" width="110" height="48" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="319" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Question</text>

<rect x="406" y="64" width="110" height="48" rx="6" fill="#f5f5f5"/>
<rect x="406" y="64" width="110" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="461" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Qdrant</text>

<rect x="548" y="60" width="150" height="56" rx="6" fill="#f5f5f5"/>
<rect x="548" y="60" width="150" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="623" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parent sections</text>
<text x="623" y="100" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nearest matches</text>
</svg>
